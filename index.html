<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard MRI — Material Receiving Inspection</title>
  <meta name="description" content="Dashboard MRI v2.6 — monitoring inspeksi penerimaan material, MRIR finding, TAT, training mandatory, dokumen QC ber-QR, dan Dashboard TV.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0F172A">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563EB'/%3E%3Cpath d='M8 23V9l8 9 8-9v14' fill='none' stroke='white' stroke-width='3' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
  <!-- Instant UX: buka koneksi TLS ke backend Apps Script & CDN sejak awal (hemat 100–300 ms panggilan pertama) -->
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Terapkan tema sebelum render (hindari kedip)
    try { var t = localStorage.getItem('mri_theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
</head>
<body>
  <div id="boot" class="boot" role="status" aria-label="Memuat aplikasi"><div class="spinner"></div></div>
  <div id="progress" class="topbar-progress"></div>
  <div id="app"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <!-- Urutan penting: config → api → ui → app → halaman -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages-dashboard.js"></script>
  <script src="js/pages-data.js"></script>
  <script src="js/pages-laporan.js"></script>
  <script src="js/pages-admin.js"></script>
  <script src="js/pages-notif.js"></script>
  <script src="js/pages-training.js"></script>
  <script src="js/pages-dokumen.js"></script>
  <script src="js/pages-master.js"></script>
  <script src="js/pages-panduan.js"></script>
  <script src="js/pages-tv.js"></script>
  <script>App.init();</script>
</body>
</html>
